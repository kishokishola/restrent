
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitchen Access — ServePoint</title><link rel="stylesheet" href="./style.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:20px;background:#0f0f1a}.box{width:min(100%,420px);padding:32px;background:var(--bg-card);border:1px solid var(--border);border-radius:18px;text-align:center}.icon{font-size:3rem}.box .form-control{margin:18px 0}.box p{color:var(--text-muted);font-size:.88rem}</style></head><body><main class="box"><div class="icon">👨‍🍳</div><h1 class="page-title">Kitchen <span>Access</span></h1><p>Enter your name to open the kitchen order screen.</p><div class="alert alert-danger">⚠️ </div><form method="post"><input class="form-control" name="display_name" maxlength="100" placeholder="Cook name" required autofocus><button class="btn btn-primary btn-block btn-lg">Open Kitchen →</button></form><a class="btn btn-ghost" style="margin-top:16px" href="./login.html">Staff / Admin login</a></main><script>
document.querySelectorAll('form').forEach((form) => form.addEventListener('submit', (event) => {
  event.preventDefault();
  const button = form.querySelector('button[type="submit"], input[type="submit"]');
  if (button) { button.disabled = true; button.dataset.originalText = button.textContent || button.value; if ('value' in button) button.value = 'Demo mode'; else button.textContent = 'Demo mode'; }
  window.alert('This is a static GitHub Pages demo. Saving data requires a backend.');
}));
</script></body></html>
